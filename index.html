<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS TECH LLC - AI Receptionist</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }
        #vapi-btn { background: #00ffcc; padding: 18px 40px; border-radius: 50px; border: none; font-size: 20px; font-weight: bold; cursor: pointer; color: #000; box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3); transition: 0.3s; }
        #vapi-btn:hover { transform: scale(1.05); background: #00e6b8; }
    </style>
</head>
<body>
    <h1>KS TECH LLC - AI Receptionist</h1>
    <p>Alex is ready to help you.</p>
    
    <!-- یہ بٹن ہے -->
    <button id="vapi-btn">Start Voice Call</button>

    <script>
      (function(d, t) {
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
        g.src = "https://vapi.ai/web-widget/dist/vapi-web-widget.js";
        g.defer = true; g.async = true;
        s.parentNode.insertBefore(g, s);

        g.onload = function() {
          const vapiInstance = window.vapiSDK;
          
          // بٹن کنکشن
          document.getElementById('vapi-btn').addEventListener('click', () => {
            vapiInstance.run({
              apiKey: "56d913d4-33f6-4964-8378-4cb3e2efd7cb", // image_f36199.png سے کاپی کریں
              assistantId: "https://vapi.ai?demo=true&shareKey=56d913d4-33f6-4964-8378-4cb3e2efd7cb&assistantId=2ecb36cd-da73-4f4f-be6c-d61ab5d91ba7",
            });
          });
        };
      })(document, "script");
    </script>
</body>
</html>
