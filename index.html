<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: Arial; padding-top: 50px; }
        button { background: #00ffcc; padding: 20px; border-radius: 50px; border: none; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>KS TECH LLC - AI Receptionist</h1>
    <p>Alex is ready to help you.</p>
    <button id="call-btn">Start Voice Call</button>

    <script>
      (function(d, t) {
        var g = d.createElement(t), s = d.nextSibling;
        g.src = "https://vapi.ai/web-widget/dist/vapi-web-widget.js";
        g.defer = true;
        g.async = true;
        d.getElementsByTagName('head')[0].appendChild(g);

        g.onload = function() {
          vapiSDK.run({
            apiKey: "56d913d4-33f6-4964-8378-4cb3e2efd7cb", // اپنا پبلک کی (image_f36199.png سے) یہاں لکھیں
            assistantId: "2ecb36cd-da73-4f4f-be6c-d61ab5d91ba7", // آپ کا اسسٹنٹ آئی ڈی
          });
        };
      })(document, "script");
    </script>
</body>
</html>
